# 自定义 5 折：每一折手工指定「训练 / 测试」受试者；验证受试者留空时，
# 训练阶段会自动从该折训练集里按 val_frac 划出验证集（绝不碰测试受试者）。
# 命令行复现：python -m core.cli train configs/train_custom_5fold.yaml
experiment:
  name: csp_lda_custom5fold
  note: "自定义 5 折（手选 train/test 受试者，val 自动划出）"

data:
  processed_dir: processed/bnci2014001

model:
  name: csp_lda
  params: {n_components: 6}

split:
  scheme: custom
  val_frac: 0.15          # 某一折没填验证受试者时，用它从训练集中划出
  seed: 42
  folds:
    - {name: fold1, train: [2, 3, 4, 5, 7, 8, 9], val: [], test: [1, 6]}
    - {name: fold2, train: [1, 3, 4, 5, 6, 8, 9], val: [], test: [2, 7]}
    - {name: fold3, train: [1, 2, 4, 5, 6, 7, 9], val: [], test: [3, 8]}
    - {name: fold4, train: [1, 2, 3, 5, 6, 7, 8], val: [], test: [4, 9]}
    - {name: fold5, train: [1, 2, 3, 6, 7, 8, 9], val: [4], test: [5]}
      #  ↑ 这一折演示「显式指定验证受试者」：S04 当验证、S05 当测试
      #    规则：同一折内 train / val / test 三方不得重叠（运行时会校验）

normalization: {mode: zscore_channel, euclidean_alignment: false}
augmentation: {}
trainer: {epochs: 60, batch_size: 64, lr: 0.001, device: auto}
class_balance: {weighted_loss: true}
