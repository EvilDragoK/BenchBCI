# BNCI2014001 (BCI Competition IV 2a) 运动想象标准预处理流水线
# 命令行复现：python -m core.pipeline configs/preprocess_bnci2014001.yaml
name: bnci2014001_standard_mi

dataset:
  # 换机器/换系统：设环境变量 BCI_DATA_ROOT 指向数据集根目录即可，无需改本文件
  root: ${BCI_DATA_ROOT:-~/Desktop/DL/BCI/data}/BNCI2014001
  subjects: "1-9"          # 'all' 或如 '1,3,5'
  sessions: [T, E]         # T=训练 session, E=评估 session（session 划分需要两者）
  eeg_only: true           # 只保留 22 个 EEG 通道

steps:
  - op: set_montage
    params: {montage: standard_1005}
    enabled: true
  - op: pick_eeg
    params: {keep_eog: false}
    enabled: true
  - op: notch_filter
    params: {freqs: [50]}
    enabled: true
  - op: bandpass_filter
    params: {l_freq: 4.0, h_freq: 40.0, method: fir, iir_order: 4}
    enabled: true
  - op: re_reference
    params: {mode: average, channels: []}
    enabled: true
  - op: ica                # 默认关闭（按需启用；拟合较慢）
    params: {n_components: 10, method: fastica, random_state: 97,
             exclude: [], autodetect_eog: false}
    enabled: false
  - op: epoching
    params: {tmin: 0.5, tmax: 2.5, baseline: true, classes: []}
    enabled: true
  - op: amplitude_reject
    params: {threshold_uv: 150.0}
    enabled: true

output:
  dir: processed/bnci2014001
  save_fif: true
  save_npy: true
